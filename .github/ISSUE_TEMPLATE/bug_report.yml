name: Bug report
description: Report something that is broken or incorrect.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve OpenForge. Please provide enough detail for someone else to understand the problem."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: What steps should someone follow to see the issue?
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: false
  - type: input
    id: location
    attributes:
      label: Link or file
      description: Add the relevant page, file or URL if applicable.
    validations:
      required: false
